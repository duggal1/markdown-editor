name: Verify
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flow
          POSTGRES_PASSWORD: flow
          POSTGRES_DB: flow
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test:format
      - run: npm run test:lists
      - run: npm run test:code-repair
      - run: npm run test:icons
      - run: npm run test:workspace-ui
      - run: npm run test:cloud
      - run: npm run test:postgres
        env:
          DATABASE_URL: postgres://flow:flow@localhost:5432/flow
      - run: node scripts/test-backup.mjs
      - run: npm run test:preview
      - run: npm run test:html
      - run: npm run test:publish-workflow
      - run: npm run test:glass
      - run: npm run test:long-scroll
      - run: npm run test:search
      - run: npm run test:tokens
      - run: npm run test:interactions
      - run: node --import tsx scripts/test-architecture.mjs
      - run: npm run test:tasks
      - run: npm run test:planner
      - run: npm run test:sync
      - run: npm run test:titles
      - run: npm run test:pdf
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pdf-style-review
          path: test-artifacts/pdf-style-review.pdf
          retention-days: 2
      - run: npm run build
