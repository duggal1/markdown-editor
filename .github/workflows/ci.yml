name: Verify
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test:format
      - run: npm run test:icons
      - run: npm run test:workspace-ui
      - run: npm run test:preview
      - run: npm run test:long-scroll
      - run: npm run test:search
      - run: npm run test:interactions
      - run: npm run test:tasks
      - run: npm run test:titles
      - run: npm run test:pdf
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pdf-style-review
          path: test-artifacts/pdf-style-review.pdf
          retention-days: 2
      - run: npm run build
