<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="description" content="Flow is a local-first Markdown workspace."/>
<meta name="theme-color" content="#0a0a0a"/>
<link rel="icon" type="image/svg+xml" sizes="any" href="/flow.svg?v=3"/>
<title>Flow · Markdown workspace</title>
<script>try{var p=JSON.parse(localStorage.getItem("flow.preferences.v1")||"{}");var t=p.theme==="dark"||p.theme==="light"?p.theme:"dark";document.documentElement.dataset.theme=t;document.querySelector('meta[name="theme-color"]').content=t==="dark"?"#0a0a0a":"#f4f4f4";}catch(e){document.documentElement.dataset.theme="dark";}</script>
</head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
